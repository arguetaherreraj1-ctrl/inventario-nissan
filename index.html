<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Nissan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <header class="bg-white shadow-md mb-6">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center border-b-4 border-red-600">
            <div>
                <h1 class="text-2xl font-bold text-red-600 tracking-wider">NISSAN</h1>
                <p class="text-sm text-gray-500 font-medium" id="nombre-tecnico">Técnico: Jorge Argueta</p>
            </div>
            <button onclick="cerrarSesion()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded font-semibold transition">
                Salir
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        <!-- Pestañas -->
        <div class="flex gap-2 mb-4">
            <button onclick="cambiarPestana('catalogo')" id="btn-catalogo" class="flex-1 bg-red-600 text-white font-bold py-3 rounded shadow-md transition">
                Catálogo
            </button>
            <button onclick="cambiarPestana('historial')" id="btn-historial" class="flex-1 bg-white text-gray-700 font-bold py-3 rounded shadow-md border hover:bg-gray-50 transition">
                Historial
            </button>
        </div>

        <!-- Buscador y Botón Agregar (Solo visible en Catálogo) -->
        <div id="barra-controles" class="flex gap-2 mb-6 bg-white p-2 rounded shadow-md">
            <div class="relative flex-1 flex">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-blue-500"></i>
                </span>
                <input type="text" id="buscador" onkeyup="filtrarHerramientas()" placeholder="Buscar código o nombre..." 
                    class="w-full pl-10 pr-4 py-3 border rounded-l focus:outline-none focus:ring-2 focus:ring-red-500 text-lg">
                
                <button id="btn-microfono" class="bg-gray-100 hover:bg-gray-200 border-y border-r border-gray-300 px-4 text-xl transition" title="Búsqueda por voz">
                    🎤
                </button>
            </div>
            <button onclick="abrirModalAgregar()" class="bg-gray-800 hover:bg-gray-900 text-white px-6 py-3 rounded font-bold text-xl shadow-md transition">
                +
            </button>
        </div>

        <!-- CONTENEDOR: CATÁLOGO -->
        <div id="contenedor-catalogo" class="bg-white rounded shadow-md overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-3 font-semibold text-gray-600">Clave</th>
                        <th class="p-3 font-semibold text-gray-600">Descripción</th>
                        <th class="p-3 font-semibold text-gray-600 text-center">Cant.</th>
                        <th class="p-3 font-semibold text-gray-600">Posición</th>
                        <th class="p-3 font-semibold text-gray-600 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-herramientas" class="divide-y"></tbody>
            </table>
            <div id="mensaje-vacio" class="text-center p-8 text-gray-500 hidden">
                No hay herramientas registradas aún. Haz clic en "+" para empezar.
            </div>
        </div>

        <!-- CONTENEDOR: HISTORIAL (Oculto por defecto) -->
        <div id="contenedor-historial" class="bg-white rounded shadow-md overflow-hidden hidden p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">Historial de Movimientos</h2>
                <!-- Botón de Excel preparado para el futuro -->
                <button onclick="descargarExcel()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-semibold shadow flex items-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> Descargar Excel
                </button>
            </div>
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-3 font-semibold text-gray-600">Fecha</th>
                        <th class="p-3 font-semibold text-gray-600">Herramienta</th>
                        <th class="p-3 font-semibold text-gray-600">Acción</th>
                        <th class="p-3 font-semibold text-gray-600">Técnico</th>
                    </tr>
                </thead>
                <tbody id="tabla-historial" class="divide-y">
                    <!-- Aquí se llenará el historial -->
                    <tr><td colspan="4" class="p-4 text-center text-gray-500">Aún no hay movimientos registrados.</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Modal Agregar -->
    <div id="modal-agregar" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center px-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Agregar Nueva Herramienta</h2>
            <form id="form-agregar" onsubmit="guardarHerramienta(event)">
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">Clave (Ej. NI-50190-C)</label>
                    <input type="text" id="nueva-clave" required class="w-full border rounded p-2 uppercase">
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">Descripción</label>
                    <input type="text" id="nueva-desc" required class="w-full border rounded p-2 uppercase">
                </div>
                
                <!-- CAMPO DE IMAGEN OPCIONAL RECUPERADO -->
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">Fotografía (Opcional)</label>
                    <!-- Nota que no tiene el atributo 'required' -->
                    <input type="file" id="nueva-img" accept="image/*" class="w-full border rounded p-2 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
                </div>

                <div class="flex gap-4 mb-4">
                    <div class="flex-1">
                        <label class="block text-gray-700 text-sm font-bold mb-1">Cantidad</label>
                        <input type="number" id="nueva-cant" required min="1" value="1" class="w-full border rounded p-2">
                    </div>
                    <div class="flex-1">
                        <label class="block text-gray-700 text-sm font-bold mb-1">Posición (Ej. A1)</label>
                        <input type="text" id="nueva-pos" required class="w-full border rounded p-2 uppercase">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="cerrarModalAgregar()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded font-semibold">Cancelar</button>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-semibold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- NAVEGACIÓN DE PESTAÑAS ---
        function cambiarPestana(pestana) {
            const btnCat = document.getElementById('btn-catalogo');
            const btnHist = document.getElementById('btn-historial');
            const contCat = document.getElementById('contenedor-catalogo');
            const contHist = document.getElementById('contenedor-historial');
            const barraCtrl = document.getElementById('barra-controles');

            if (pestana === 'catalogo') {
                btnCat.className = "flex-1 bg-red-600 text-white font-bold py-3 rounded shadow-md transition";
                btnHist.className = "flex-1 bg-white text-gray-700 font-bold py-3 rounded shadow-md border hover:bg-gray-50 transition";
                contCat.classList.remove('hidden');
                barraCtrl.classList.remove('hidden');
                contHist.classList.add('hidden');
            } else {
                btnHist.className = "flex-1 bg-red-600 text-white font-bold py-3 rounded shadow-md transition";
                btnCat.className = "flex-1 bg-white text-gray-700 font-bold py-3 rounded shadow-md border hover:bg-gray-50 transition";
                contHist.classList.remove('hidden');
                contCat.classList.add('hidden');
                barraCtrl.classList.add('hidden');
            }
        }

        // --- BÚSQUEDA POR VOZ ---
        const btnMicrofono = document.getElementById('btn-microfono');
        const buscador = document.getElementById('buscador');
        const ReconocimientoVoz = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (ReconocimientoVoz) {
            const reconocimiento = new ReconocimientoVoz();
            reconocimiento.lang = 'es-MX'; 
            reconocimiento.continuous = false; 

            btnMicrofono.addEventListener('click', () => {
                reconocimiento.start();
                btnMicrofono.innerHTML = '🔴'; 
                btnMicrofono.classList.add('bg-red-100', 'text-red-600');
            });

            reconocimiento.onresult = (evento) => {
                buscador.value = evento.results[0][0].transcript; 
                btnMicrofono.innerHTML = '🎤';
                btnMicrofono.classList.remove('bg-red-100', 'text-red-600');
                filtrarHerramientas(); 
            };

            reconocimiento.onerror = () => {
                btnMicrofono.innerHTML = '🎤';
                btnMicrofono.classList.remove('bg-red-100', 'text-red-600');
            };
        } else {
            btnMicrofono.style.display = 'none'; 
        }

        // --- FUNCIONES DE HERRAMIENTAS ---
        async function cargarCatalogo() {
            try {
                const respuesta = await fetch('/api/herramientas'); 
                const herramientas = await respuesta.json();
                
                const tbody = document.getElementById('tabla-herramientas');
                const msjVacio = document.getElementById('mensaje-vacio');
                
                tbody.innerHTML = ''; 
                
                if(herramientas.length === 0) {
                    msjVacio.classList.remove('hidden');
                } else {
                    msjVacio.classList.add('hidden');
                    herramientas.forEach(h => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 herramienta-fila";
                        tr.innerHTML = `
                            <td class="p-3 border-b text-gray-800 font-medium clave-herr">${h.clave}</td>
                            <td class="p-3 border-b text-gray-600 desc-herr">${h.descripcion}</td>
                            <td class="p-3 border-b text-center text-gray-800 font-bold">${h.cantidad}</td>
                            <td class="p-3 border-b text-blue-600 font-semibold">${h.posicion}</td>
                            <td class="p-3 border-b text-center">
                                <button class="text-red-600 hover:text-red-800 font-bold px-2 py-1 bg-red-100 rounded">Prestar</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Error al cargar datos:", error);
            }
        }

        function filtrarHerramientas() {
            const texto = buscador.value.toLowerCase();
            const filas = document.querySelectorAll('.herramienta-fila');
            
            filas.forEach(fila => {
                const clave = fila.querySelector('.clave-herr').innerText.toLowerCase();
                const desc = fila.querySelector('.desc-herr').innerText.toLowerCase();
                fila.style.display = (clave.includes(texto) || desc.includes(texto)) ? '' : 'none';
            });
        }

        function abrirModalAgregar() { document.getElementById('modal-agregar').classList.remove('hidden'); }
        function cerrarModalAgregar() { 
            document.getElementById('modal-agregar').classList.add('hidden'); 
            document.getElementById('form-agregar').reset(); 
        }

        async function guardarHerramienta(evento) {
            evento.preventDefault();
            
            // Usamos FormData para poder enviar la imagen junto con los textos
            const formData = new FormData();
            formData.append('clave', document.getElementById('nueva-clave').value.toUpperCase());
            formData.append('descripcion', document.getElementById('nueva-desc').value.toUpperCase());
            formData.append('cantidad', document.getElementById('nueva-cant').value);
            formData.append('posicion', document.getElementById('nueva-pos').value.toUpperCase());
            
            // Adjuntamos la imagen solo si el usuario seleccionó una
            const inputImg = document.getElementById('nueva-img');
            if (inputImg.files.length > 0) {
                formData.append('imagen', inputImg.files[0]);
            }

            try {
                await fetch('/api/herramientas', {
                    method: 'POST',
                    body: formData // Nota: al usar FormData no se pone headers Content-Type
                });
                
                cerrarModalAgregar();
                cargarCatalogo(); 
            } catch (error) {
                alert("Error al guardar la herramienta.");
            }
        }

        function descargarExcel() {
            alert("Esta función descargará el reporte en la siguiente fase de desarrollo.");
        }

        function cerrarSesion() { window.location.href = '/login'; }
        window.onload = cargarCatalogo;
    </script>
</body>
</html>
