<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Nissan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Encabezado Principal -->
    <header class="bg-white shadow-md mb-6">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center border-b-4 border-red-600">
            <div>
                <h1 class="text-2xl font-bold text-red-600 tracking-wider">NISSAN</h1>
                <p class="text-sm text-gray-500 font-medium" id="nombre-tecnico">Técnico: Jorge Argueta</p>
            </div>
            <button onclick="cerrarSesion()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded font-semibold transition">
                Salir
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4">
        <!-- Pestañas de Navegación -->
        <div class="flex gap-2 mb-4">
            <button class="flex-1 bg-red-600 text-white font-bold py-3 rounded shadow-md" id="btn-catalogo">
                Catálogo
            </button>
            <button class="flex-1 bg-white text-gray-700 font-bold py-3 rounded shadow-md border hover:bg-gray-50" id="btn-historial">
                Historial
            </button>
        </div>

        <!-- Barra de Búsqueda y Botones de Acción -->
        <div class="flex gap-2 mb-6 bg-white p-2 rounded shadow-md">
            <div class="relative flex-1 flex">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass text-blue-500"></i>
                </span>
                <!-- Input de búsqueda -->
                <input type="text" id="buscador" onkeyup="filtrarHerramientas()" placeholder="Buscar código o nombre..." 
                    class="w-full pl-10 pr-4 py-3 border rounded-l focus:outline-none focus:ring-2 focus:ring-red-500 text-lg">
                
                <!-- BOTÓN DE MICRÓFONO (Búsqueda por Voz) -->
                <button id="btn-microfono" class="bg-gray-100 hover:bg-gray-200 border-y border-r border-gray-300 px-4 text-xl transition" title="Búsqueda por voz">
                    🎤
                </button>
            </div>
            
            <!-- Botón para Agregar Herramienta -->
            <button onclick="abrirModalAgregar()" class="bg-gray-800 hover:bg-gray-900 text-white px-6 py-3 rounded font-bold text-xl shadow-md transition">
                +
            </button>
        </div>

        <!-- Contenedor del Catálogo (Tabla) -->
        <div class="bg-white rounded shadow-md overflow-hidden" id="contenedor-catalogo">
            <table class="w-full text-left border-collapse">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="p-3 font-semibold text-gray-600">Clave</th>
                        <th class="p-3 font-semibold text-gray-600">Descripción</th>
                        <th class="p-3 font-semibold text-gray-600 text-center">Cant.</th>
                        <th class="p-3 font-semibold text-gray-600">Posición</th>
                        <th class="p-3 font-semibold text-gray-600 text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-herramientas" class="divide-y">
                    <!-- Los datos de PostgreSQL se inyectarán aquí desde JavaScript -->
                </tbody>
            </table>
            <!-- Mensaje si está vacío -->
            <div id="mensaje-vacio" class="text-center p-8 text-gray-500 hidden">
                No hay herramientas registradas aún. Haz clic en el botón "+" para empezar.
            </div>
        </div>
    </main>

    <!-- Modal para Agregar Herramienta -->
    <div id="modal-agregar" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center px-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Agregar Nueva Herramienta</h2>
            <form id="form-agregar" onsubmit="guardarHerramienta(event)">
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">Clave (Ej. NI-50190-C)</label>
                    <input type="text" id="nueva-clave" required class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-red-500 uppercase">
                </div>
                <div class="mb-3">
                    <label class="block text-gray-700 text-sm font-bold mb-1">Descripción</label>
                    <input type="text" id="nueva-desc" required class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-red-500 uppercase">
                </div>
                <div class="flex gap-4 mb-4">
                    <div class="flex-1">
                        <label class="block text-gray-700 text-sm font-bold mb-1">Cantidad</label>
                        <input type="number" id="nueva-cant" required min="1" value="1" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <div class="flex-1">
                        <label class="block text-gray-700 text-sm font-bold mb-1">Posición (Ej. A1)</label>
                        <input type="text" id="nueva-pos" required class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-red-500 uppercase">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="cerrarModalAgregar()" class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-4 py-2 rounded font-semibold">Cancelar</button>
                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-semibold">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts de Lógica y Búsqueda por Voz -->
    <script>
        // ==========================================
        // 1. LÓGICA DE BÚSQUEDA POR VOZ (Web Speech API)
        // ==========================================
        const btnMicrofono = document.getElementById('btn-microfono');
        const buscador = document.getElementById('buscador');

        // Detectar si el navegador soporta dictado
        const ReconocimientoVoz = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (ReconocimientoVoz) {
            const reconocimiento = new ReconocimientoVoz();
            reconocimiento.lang = 'es-MX'; // Español de México
            reconocimiento.continuous = false; 

            btnMicrofono.addEventListener('click', () => {
                reconocimiento.start();
                btnMicrofono.innerHTML = '🔴'; // Indicador visual de que está escuchando
                btnMicrofono.classList.add('bg-red-100', 'text-red-600');
            });

            reconocimiento.onresult = (evento) => {
                const textoEscuchado = evento.results[0][0].transcript;
                buscador.value = textoEscuchado; 
                btnMicrofono.innerHTML = '🎤';
                btnMicrofono.classList.remove('bg-red-100', 'text-red-600');
                
                // Dispara la función de filtrado automáticamente
                filtrarHerramientas(); 
            };

            reconocimiento.onerror = (evento) => {
                console.error("Error al escuchar: ", evento.error);
                btnMicrofono.innerHTML = '🎤';
                btnMicrofono.classList.remove('bg-red-100', 'text-red-600');
                alert("No se pudo escuchar correctamente. Por favor, intenta de nuevo.");
            };
        } else {
            // Ocultar el botón si el celular/navegador no soporta micrófono
            btnMicrofono.style.display = 'none'; 
        }

        // ==========================================
        // 2. LÓGICA DEL FRONTEND Y CONEXIÓN A POSTGRESQL
        // ==========================================
        
        // Simulación de carga inicial (Aquí va tu fetch al backend de FastAPI/Flask)
        async function cargarCatalogo() {
            try {
                // Cambia '/api/herramientas' por la ruta real que configuraste en tu backend
                const respuesta = await fetch('/api/herramientas'); 
                const herramientas = await respuesta.json();
                
                const tbody = document.getElementById('tabla-herramientas');
                const msjVacio = document.getElementById('mensaje-vacio');
                
                tbody.innerHTML = ''; // Limpiar tabla
                
                if(herramientas.length === 0) {
                    msjVacio.classList.remove('hidden');
                } else {
                    msjVacio.classList.add('hidden');
                    herramientas.forEach(h => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 herramienta-fila";
                        tr.innerHTML = `
                            <td class="p-3 border-b text-gray-800 font-medium clave-herr">${h.clave}</td>
                            <td class="p-3 border-b text-gray-600 desc-herr">${h.descripcion}</td>
                            <td class="p-3 border-b text-center text-gray-800 font-bold">${h.cantidad}</td>
                            <td class="p-3 border-b text-blue-600 font-semibold">${h.posicion}</td>
                            <td class="p-3 border-b text-center">
                                <button class="text-red-600 hover:text-red-800 font-bold px-2 py-1 bg-red-100 rounded">Prestar</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error("Error al cargar la base de datos:", error);
            }
        }

        // Función para filtrar herramientas en vivo (texto o voz)
        function filtrarHerramientas() {
            const texto = buscador.value.toLowerCase();
            const filas = document.querySelectorAll('.herramienta-fila');
            
            filas.forEach(fila => {
                const clave = fila.querySelector('.clave-herr').innerText.toLowerCase();
                const desc = fila.querySelector('.desc-herr').innerText.toLowerCase();
                
                if (clave.includes(texto) || desc.includes(texto)) {
                    fila.style.display = '';
                } else {
                    fila.style.display = 'none';
                }
            });
        }

        // Funciones para Modales
        function abrirModalAgregar() {
            document.getElementById('modal-agregar').classList.remove('hidden');
        }

        function cerrarModalAgregar() {
            document.getElementById('modal-agregar').classList.add('hidden');
            document.getElementById('form-agregar').reset();
        }

        // Guardar nueva herramienta en la base de datos
        async function guardarHerramienta(evento) {
            evento.preventDefault();
            
            const nuevaHerramienta = {
                clave: document.getElementById('nueva-clave').value.toUpperCase(),
                descripcion: document.getElementById('nueva-desc').value.toUpperCase(),
                cantidad: parseInt(document.getElementById('nueva-cant').value),
                posicion: document.getElementById('nueva-pos').value.toUpperCase()
            };

            try {
                // Cambia '/api/herramientas' por la ruta real de tu backend
                await fetch('/api/herramientas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevaHerramienta)
                });
                
                cerrarModalAgregar();
                cargarCatalogo(); // Recarga la tabla para mostrar el nuevo registro
                
            } catch (error) {
                alert("Error al guardar en la nube.");
                console.error(error);
            }
        }

        function cerrarSesion() {
            // Aquí puedes borrar el token de localStorage y redirigir al login
            window.location.href = '/login'; 
        }

        // Cargar las herramientas al abrir la página
        window.onload = cargarCatalogo;
    </script>
</body>
</html>
